services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parser}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parser-secret}
    volumes:
      - minio-data:/data

volumes:
  minio-data:
